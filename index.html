<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rancho P2P</title>
<style>
:root{--bg:#1b1d1a;--panel:#232622;--panel2:#2b2f2a;--line:#3a3f38;--txt:#e9ebe4;--dim:#9aa293;--acc:#e0b84c;--ok:#6fbf73}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:15px/1.45 "Trebuchet MS","Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#1b1d1a;border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;width:100%}
#login{height:100%;display:grid;place-items:center;padding:16px}
#login form{width:min(380px,100%);display:grid;gap:10px}
h1{margin:0 0 4px;font-size:26px;letter-spacing:.5px}
.dim{color:var(--dim);font-size:13px}
#app{display:none;height:100%;grid-template-columns:210px 1fr 190px}
aside{background:var(--panel);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:6px}
aside h2{font-size:13px;color:var(--dim);margin:8px 0 2px;font-weight:600}
.row{display:flex;gap:2px}
.ch{text-align:left;flex:1;border:0;background:none;padding:7px 8px}
.ch.on{background:var(--panel2);color:var(--acc)}
.x{border:0;background:none;color:var(--dim);padding:7px 8px}
.x:hover{color:#d9674f}
#add{width:100%;margin-top:4px}
main{display:flex;flex-direction:column;min-width:0}
#bar{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#bar b{margin-right:auto}
#stage{display:none;gap:8px;padding:8px;background:#000;flex-wrap:wrap;max-height:45%;overflow:auto}
#stage video{max-width:100%;max-height:260px;background:#111;border-radius:6px}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{overflow-wrap:anywhere}
.m b{color:var(--acc)}
.m.me b{color:var(--ok)}
.m.sys{color:var(--dim);font-size:13px}
.m a{color:var(--acc)}
.m img{display:block;margin-top:4px;max-width:min(420px,100%);max-height:320px;border-radius:6px;cursor:zoom-in}
.m iframe{display:block;margin-top:6px;width:min(480px,100%);aspect-ratio:16/9;border:0;border-radius:6px;background:#000}
#send{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
#prog{height:3px;background:var(--acc);width:0;transition:width .15s}
.peer{display:flex;align-items:center;gap:6px;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
body.drag #msgs{outline:2px dashed var(--acc);outline-offset:-8px}
@media(max-width:720px){#app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;align-items:center;padding:6px 10px}aside h2{display:none}#chs{display:flex;flex-wrap:wrap}#peers{display:none}#add{width:auto;margin:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="login">
  <form id="f">
    <h1>Rancho P2P</h1>
    <p class="dim">Entrá con tus amigos usando el mismo nombre de sala y clave. No hay servidor ni mensajes guardados.</p>
    <input id="nick" placeholder="Tu apodo" required maxlength="20" autocomplete="off">
    <input id="srv" placeholder="Nombre de la sala (ej: los-pibes)" required autocomplete="off">
    <input id="pwd" type="password" placeholder="Clave" required>
    <button class="on" type="submit">Entrar</button>
  </form>
</div>

<div id="app">
  <aside>
    <h2>Canales</h2>
    <div id="chs"></div>
    <button id="add">+ Crear canal</button>
    <h2>Conexión</h2>
    <span class="dim" id="status">Buscando amigos…</span>
  </aside>
  <main>
    <div id="bar">
      <b id="title"></b>
      <button id="bMic">Activar voz</button>
      <button id="bMute" disabled>Silenciar</button>
      <button id="bScr">Compartir pantalla</button>
      <button id="bFile">Enviar archivo</button>
      <input type="file" id="file" hidden>
    </div>
    <div id="prog"></div>
    <div id="stage"></div>
    <div id="msgs" aria-live="polite"></div>
    <div id="send">
      <input id="txt" placeholder="Escribí un mensaje, pegá una imagen o un link" autocomplete="off">
      <button class="on" id="bSend">Enviar</button>
    </div>
  </main>
  <aside id="peers"><h2>Conectados</h2><div id="plist"></div></aside>
</div>

<script type="module">
// Trackers de torrent para encontrarse. Si no conectan, probá con 'trystero@0.21.5/nostr'.
import { joinRoom, selfId } from 'https://cdn.jsdelivr.net/npm/trystero@0.21.5/torrent/+esm'

const $ = id => document.getElementById(id)
const CHUNK = 256 * 1024
let cfg, room, lobby, canal, nick, acts = {}, sendCanales
let canales = ['general']
let peers = {}, mic = null, screen = null, streams = {}

const rtcConfig = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
  // Para TURN: { urls:'turn:...', username:'...', credential:'...' }
] }

/* ---------- Login ---------- */
try {
  $('nick').value = localStorage.getItem('rancho-nick') || ''
  $('srv').value = localStorage.getItem('rancho-sala') || ''
} catch {}
// Si ya hay apodo y sala guardados, solo falta la clave
;($('nick').value && $('srv').value ? $('pwd') : $('nick').value ? $('srv') : $('nick')).focus()

$('f').onsubmit = e => {
  e.preventDefault()
  nick = $('nick').value.trim()
  try { localStorage.setItem('rancho-nick', nick); localStorage.setItem('rancho-sala', $('srv').value.trim()) } catch {}
  cfg = { appId: 'rancho-p2p-' + $('srv').value.trim().toLowerCase(), password: $('pwd').value, rtcConfig }
  $('login').style.display = 'none'; $('app').style.display = 'grid'
  try { const g = JSON.parse(localStorage.getItem('canales2-' + cfg.appId)); if (g && typeof g === 'object') Object.entries(g).forEach(([c, v]) => fusionar(c, v, false)) } catch {}
  iniciarLobby(); pintarCanales(); entrar('general')
}

/* ---------- Canales: se sincronizan por una sala "lobby" siempre abierta ---------- */
const limpio = n => n.toLowerCase().trim().replace(/[^a-z0-9_-]+/g, '-').replace(/^[-_]+|-+$/g, '').slice(0, 20)
// Cada canal tiene {ts, del}. Gana siempre el cambio más nuevo, así un canal borrado no reaparece.
let estado = { general: { ts: 0, del: false } }
function recalcular() { canales = Object.keys(estado).filter(c => !estado[c].del) }
function guardarCanales() { try { localStorage.setItem('canales2-' + cfg.appId, JSON.stringify(estado)) } catch {} }
function cambiar(c, del) {
  estado[c] = { ts: Date.now(), del }; recalcular(); guardarCanales()
  sendCanales({ t: 'set', c, del, ts: estado[c].ts })
}
function fusionar(c, v, avisar) {
  c = limpio(String(c))
  if (!c || c === 'general' || !v || typeof v.ts !== 'number') return
  if (estado[c] && estado[c].ts >= v.ts) return
  const antes = estado[c] && !estado[c].del
  estado[c] = { ts: v.ts, del: !!v.del }; recalcular()
  if (avisar && antes !== !v.del) sys((v.del ? 'Se quitó' : 'Se creó') + ' el canal #' + c)
  if (v.del && canal === c) entrar('general')
}
function iniciarLobby() {
  lobby = joinRoom(cfg, '_lobby')
  const [send, on] = lobby.makeAction('canales')
  sendCanales = send
  lobby.onPeerJoin(id => send({ t: 'estado', e: estado }, id))
  on(m => {
    if (m.t === 'estado' && m.e) Object.entries(m.e).forEach(([c, v]) => fusionar(c, v, false))
    if (m.t === 'set') fusionar(m.c, { ts: m.ts, del: m.del }, true)
    guardarCanales(); pintarCanales()
  })
}
function pintarCanales() {
  $('chs').innerHTML = ''
  canales.forEach(c => {
    const r = document.createElement('div'); r.className = 'row'
    const b = document.createElement('button'); b.className = 'ch' + (c === canal ? ' on' : ''); b.textContent = '# ' + c
    b.onclick = () => entrar(c); r.append(b)
    if (c !== 'general') {
      const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.title = 'Quitar canal'; x.setAttribute('aria-label', 'Quitar canal ' + c)
      x.onclick = () => { if (confirm('¿Quitar #' + c + ' para todos?')) {
        cambiar(c, true)
        if (canal === c) entrar('general'); else pintarCanales() } }
      r.append(x)
    }
    $('chs').append(r)
  })
}
$('add').onclick = () => {
  const c = limpio(prompt('Nombre del canal nuevo') || '')
  if (!c) return
  if (c !== 'general' && !canales.includes(c)) cambiar(c, false)
  entrar(c)
}

/* ---------- Render de mensajes ---------- */
const URL_RE = /https?:\/\/[^\s<]+/g
function ytId(u) {
  try {
    const x = new URL(u); let id = ''
    if (x.hostname === 'youtu.be') id = x.pathname.slice(1)
    else if (/(^|\.)youtube\.com$/.test(x.hostname)) {
      if (x.pathname === '/watch') id = x.searchParams.get('v') || ''
      else { const m = x.pathname.match(/^\/(shorts|embed|live)\/([\w-]+)/); if (m) id = m[2] }
    }
    return /^[\w-]{11}$/.test(id) ? id : null
  } catch { return null }
}
function renderTexto(texto) {
  const frag = document.createDocumentFragment(), embeds = []
  let ult = 0
  for (const m of texto.matchAll(URL_RE)) {
    frag.append(document.createTextNode(texto.slice(ult, m.index)))
    const a = document.createElement('a'); a.href = m[0]; a.textContent = m[0]; a.target = '_blank'; a.rel = 'noopener noreferrer'
    frag.append(a); ult = m.index + m[0].length
    const id = ytId(m[0])
    if (id) { const f = document.createElement('iframe')
      f.src = 'https://www.youtube-nocookie.com/embed/' + id; f.allowFullscreen = true; f.loading = 'lazy'
      f.allow = 'accelerometer; autoplay; encrypted-media; picture-in-picture'; f.title = 'Video de YouTube'; embeds.push(f) }
  }
  frag.append(document.createTextNode(texto.slice(ult)))
  embeds.forEach(e => frag.append(e))
  return frag
}
function add(cls, who, contenido) {
  const d = document.createElement('div'); d.className = 'm ' + cls
  if (who) { const b = document.createElement('b'); b.textContent = who + ': '; d.append(b) }
  d.append(contenido); $('msgs').append(d); $('msgs').scrollTop = 1e9
}
const sys = t => add('sys', '', document.createTextNode(t))
function mostrarArchivo(cls, who, blob, nombre, size) {
  const url = URL.createObjectURL(blob)
  if (blob.type.startsWith('image/')) {
    const a = document.createElement('a'); a.href = url; a.target = '_blank'
    const img = document.createElement('img'); img.src = url; img.alt = nombre; img.onload = () => $('msgs').scrollTop = 1e9
    a.append(img); add(cls, who, a)
  } else {
    const a = document.createElement('a'); a.href = url; a.download = nombre
    a.textContent = (cls === 'me' ? 'Enviaste ' : 'Descargar ') + nombre + ' (' + (size / 1048576).toFixed(1) + ' MB)'
    add(cls, who, a)
  }
}

/* ---------- Sala actual ---------- */
function pintarPeers() {
  const l = $('plist'); l.innerHTML = ''
  ;[{ nick: nick + ' (vos)' }, ...Object.values(peers)].forEach(p => {
    const d = document.createElement('div'); d.className = 'peer'
    d.innerHTML = '<span class="dot"></span>'; d.append(document.createTextNode(p.nick || 'alguien')); l.append(d)
  })
  const n = Object.keys(peers).length
  $('status').textContent = n ? n + ' amigo(s) conectado(s)' : 'Buscando amigos…'
}

async function entrar(c) {
  if (room) { pararMedia(); room.leave() }
  canal = c; peers = {}; streams = {}
  $('stage').innerHTML = ''; $('stage').style.display = 'none'; $('msgs').innerHTML = ''
  $('title').textContent = '# ' + c; pintarCanales()
  room = joinRoom(cfg, c)

  const [sendMsg, onMsg] = room.makeAction('chat')
  const [sendPerfil, onPerfil] = room.makeAction('perfil')
  const [sendFile, onFile] = room.makeAction('archivo')
  acts = { sendMsg, sendFile }

  room.onPeerJoin(id => {
    sendPerfil({ nick }, id); peers[id] = peers[id] || { nick: 'alguien' }; pintarPeers()
    if (mic) room.addStream(mic, id, { tipo: 'voz' })
    if (screen) room.addStream(screen, id, { tipo: 'pantalla' })
  })
  room.onPeerLeave(id => { sys((peers[id]?.nick || 'Alguien') + ' salió'); delete peers[id]; quitarStream(id); pintarPeers() })
  onPerfil((p, id) => { peers[id] = { nick: String(p.nick).slice(0, 20) }; sys(peers[id].nick + ' entró'); pintarPeers() })
  onMsg((t, id) => add('', peers[id]?.nick || 'alguien', renderTexto(String(t))))

  const rx = {}
  onFile((buf, id, meta) => {
    const k = id + meta.fid, r = rx[k] = rx[k] || { parts: [], n: 0 }
    r.parts.push(buf); r.n++
    $('prog').style.width = (r.n / meta.total * 100) + '%'
    if (r.n === meta.total) {
      delete rx[k]; setTimeout(() => $('prog').style.width = 0, 500)
      mostrarArchivo('', peers[id]?.nick || 'alguien', new Blob(r.parts, { type: meta.mime }), meta.nombre, meta.size)
    }
  })
  room.onPeerStream((stream, id, meta) => mostrarStream(stream, id, meta || {}))
  pintarPeers()
}

/* ---------- Chat ---------- */
function mandar() {
  const t = $('txt').value.trim(); if (!t) return
  acts.sendMsg(t); add('me', nick, renderTexto(t)); $('txt').value = ''
}
$('bSend').onclick = mandar
$('txt').onkeydown = e => { if (e.key === 'Enter') mandar() }

/* ---------- Archivos e imágenes (botón, pegar, arrastrar) ---------- */
async function enviarArchivo(f) {
  if (!f) return
  mostrarArchivo('me', nick, f, f.name || 'imagen.png', f.size)
  const total = Math.max(1, Math.ceil(f.size / CHUNK)), fid = Math.random().toString(36).slice(2)
  const meta = { fid, total, nombre: f.name || 'imagen.png', size: f.size, mime: f.type }
  for (let i = 0; i < total; i++) {
    await acts.sendFile(await f.slice(i * CHUNK, (i + 1) * CHUNK).arrayBuffer(), null, meta)
    $('prog').style.width = ((i + 1) / total * 100) + '%'
  }
  setTimeout(() => $('prog').style.width = 0, 500)
}
$('bFile').onclick = () => $('file').click()
$('file').onchange = e => { enviarArchivo(e.target.files[0]); e.target.value = '' }
document.addEventListener('paste', e => {
  const it = [...(e.clipboardData?.items || [])].find(i => i.kind === 'file')
  if (it) { e.preventDefault(); enviarArchivo(it.getAsFile()) }
})
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag') })
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drag') })
document.addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('drag'); [...e.dataTransfer.files].forEach(enviarArchivo) })

/* ---------- Voz y pantalla ---------- */
function mostrarStream(stream, id, meta) {
  streams[id] = streams[id] || {}
  const el = document.createElement(meta.tipo === 'pantalla' ? 'video' : 'audio')
  el.srcObject = stream; el.autoplay = true; el.playsInline = true
  if (meta.tipo === 'pantalla') { el.controls = true; $('stage').append(el); $('stage').style.display = 'flex' }
  else { el.style.display = 'none'; document.body.append(el) }
  el.play?.().catch(() => sys('Tocá la pantalla para activar el audio.'))
  streams[id][meta.tipo] = el
}
function quitarStream(id) {
  const s = streams[id]; if (!s) return
  Object.values(s).forEach(el => el.remove()); delete streams[id]
  if (!$('stage').children.length) $('stage').style.display = 'none'
}
$('bMic').onclick = async () => {
  if (mic) { room.removeStream(mic); mic.getTracks().forEach(t => t.stop()); mic = null
    $('bMic').textContent = 'Activar voz'; $('bMic').classList.remove('on'); $('bMute').disabled = true; return }
  try {
    mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
    room.addStream(mic, null, { tipo: 'voz' })
    $('bMic').textContent = 'Salir de voz'; $('bMic').classList.add('on'); $('bMute').disabled = false
  } catch { sys('No se pudo usar el micrófono. Revisá el permiso del navegador.') }
}
$('bMute').onclick = () => {
  const t = mic.getAudioTracks()[0]; t.enabled = !t.enabled
  $('bMute').textContent = t.enabled ? 'Silenciar' : 'Activar mic'
}
$('bScr').onclick = async () => {
  if (screen) return pararPantalla()
  try {
    screen = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true })
    room.addStream(screen, null, { tipo: 'pantalla' })
    screen.getVideoTracks()[0].onended = pararPantalla
    $('bScr').textContent = 'Dejar de compartir'; $('bScr').classList.add('on')
  } catch { screen = null }
}
function pararPantalla() {
  if (!screen) return
  room.removeStream(screen); screen.getTracks().forEach(t => t.stop()); screen = null
  $('bScr').textContent = 'Compartir pantalla'; $('bScr').classList.remove('on')
}
function pararMedia() {
  pararPantalla()
  if (mic) { mic.getTracks().forEach(t => t.stop()); mic = null }
  $('bMic').textContent = 'Activar voz'; $('bMic').classList.remove('on'); $('bMute').disabled = true
  Object.keys(streams).forEach(quitarStream)
}
</script>
</body>
</html>
