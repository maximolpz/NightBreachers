<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rancho P2P</title>
<style>
:root{--bg:#1b1d1a;--panel:#232622;--panel2:#2b2f2a;--line:#3a3f38;--txt:#e9ebe4;--dim:#9aa293;--acc:#e0b84c;--ok:#6fbf73}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--txt);font:15px/1.45 "Trebuchet MS","Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#1b1d1a;border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;width:100%}
#login{height:100%;display:grid;place-items:center;padding:16px}
#login form{width:min(380px,100%);display:grid;gap:10px}
h1{margin:0 0 4px;font-size:26px}
.dim{color:var(--dim);font-size:13px}
#app{display:none;height:100%;grid-template-columns:210px minmax(0,1fr) 190px;grid-template-rows:minmax(0,1fr)}
aside{background:var(--panel);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:6px}
aside h2{font-size:13px;color:var(--dim);margin:8px 0 2px;font-weight:600}
.row{display:flex;gap:2px}
.ch{text-align:left;flex:1;border:0;background:none;padding:7px 8px}
.ch.on{background:var(--panel2);color:var(--acc)}
.ch.new{font-weight:700}
.ch.new::after{content:" •";color:var(--acc)}
.x{border:0;background:none;color:var(--dim);padding:7px 8px}
.x:hover{color:#d9674f}
#add{width:100%;margin-top:4px}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#msgwrap{position:relative;flex:1;min-height:0;display:flex}
#down{display:none;position:absolute;right:18px;bottom:12px;border-radius:999px;background:var(--acc);color:#1b1d1a;border-color:var(--acc);box-shadow:0 2px 10px #0008}
#bar{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#bar b{margin-right:auto}
#stage{display:none;gap:8px;padding:8px;background:#000;flex-wrap:wrap;max-height:45%;overflow:auto}
#stage video{max-width:100%;max-height:260px;background:#111;border-radius:6px}
#msgs{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{overflow-wrap:anywhere}
.m b{color:var(--acc)}
.m.me b{color:var(--ok)}
.m.sys{color:var(--dim);font-size:13px}
.m a{color:var(--acc)}
.adj{display:block;width:fit-content;max-width:100%;margin-top:4px;padding:6px;border:2px solid #5d6558;border-radius:10px;background:var(--panel)}
.adj img,.adj video{display:block;max-width:min(420px,100%);max-height:320px;border-radius:6px}
.adj img{cursor:zoom-in}
.m iframe{display:block;margin-top:6px;width:min(480px,100%);aspect-ratio:16/9;border:0;border-radius:6px;background:#000}
#send{position:relative;display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--bg)}
#bEmo{font-size:18px;padding:4px 10px}
#emo{display:none;position:absolute;right:12px;bottom:calc(100% + 6px);z-index:10;border-radius:10px;overflow:hidden;background:var(--panel);box-shadow:0 6px 24px #000a;color:var(--dim);padding:0}
#emo emoji-picker{width:min(340px,92vw);height:360px}
#prog{height:3px;background:var(--acc);width:0;transition:width .15s}
.peer{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.peer input[type=range]{width:100%;padding:0;border:0;background:none;accent-color:var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
body.drag #msgs{outline:2px dashed var(--acc);outline-offset:-8px}
@media(max-width:720px){#app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}aside{flex-direction:row;flex-wrap:wrap;align-items:center;padding:6px 10px}aside h2{display:none}#chs{display:flex;flex-wrap:wrap}#peers{max-height:110px;flex-direction:column;flex-wrap:nowrap;align-items:stretch}#add{width:auto;margin:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="login">
  <form id="f">
    <h1>Rancho P2P</h1>
    <p class="dim">Entrá con tus amigos usando el mismo nombre de sala y clave. No hay servidor: el historial queda guardado solo en tu navegador.</p>
    <input id="nick" placeholder="Tu apodo" required maxlength="20" autocomplete="off">
    <input id="srv" placeholder="Nombre de la sala (ej: los-pibes)" required autocomplete="off">
    <input id="pwd" type="password" placeholder="Clave" required>
    <button class="on" type="submit">Entrar</button>
  </form>
</div>

<div id="app">
  <aside>
    <h2>Canales</h2>
    <div id="chs"></div>
    <button id="add">+ Crear canal</button>
    <h2>Conexión</h2>
    <span class="dim" id="status">Buscando amigos…</span>
    <button id="reco">Reconectar</button>
    <button id="salir">Salir</button>
    <button id="snd">Sonido: sí</button>
  </aside>
  <main>
    <div id="bar">
      <b id="title"></b>
      <button id="bMic">Activar voz</button>
      <button id="bMute" disabled>Silenciar</button>
      <button id="bRuido" class="on">Supresión de ruido: sí</button>
      <button id="bScr">Compartir pantalla</button>
      <button id="bFile">Enviar archivo</button>
      <input type="file" id="file" hidden>
    </div>
    <div id="prog"></div>
    <div id="stage"></div>
    <div id="msgwrap">
      <div id="msgs" aria-live="polite"></div>
      <button id="down">↓ Ir al final</button>
    </div>
    <div id="send">
      <input id="txt" placeholder="Escribí un mensaje, pegá una imagen o un link" autocomplete="off">
      <button id="bEmo" type="button" aria-label="Emojis" title="Emojis">😊</button>
      <button class="on" id="bSend">Enviar</button>
      <div id="emo"></div>
    </div>
  </main>
  <aside id="peers"><h2>Conectados</h2><div id="plist"></div></aside>
</div>

<script type="module">
// Trackers de torrent para encontrarse. Si no conectan, probá con 'trystero@0.21.5/nostr'.
import { joinRoom } from 'https://cdn.jsdelivr.net/npm/trystero@0.21.5/torrent/+esm'

const $ = id => document.getElementById(id)
const CHUNK = 256 * 1024, MAXSAVE = 25 * 1048576
let cfg, room, canal = 'general', nick, acts = {}, db = null
let estado = { general: { ts: 0, del: false } }, canales = ['general'], noLeidos = new Set()
let peers = {}, salida = { voz: null, pantalla: null }, enviados = new Set(), remotos = {}
let volumenes = {}, nuevos = 0, ruido = true, ac = null, sonido = true

const rtcConfig = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
  // Para TURN: { urls:'turn:...', username:'...', credential:'...' }
] }
const limpio = n => n.toLowerCase().trim().replace(/[^a-z0-9_-]+/g, '-').replace(/^[-_]+|-+$/g, '').slice(0, 20)
const fmt = b => b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1) + ' MB'

// Sonido suave de mensaje nuevo (sintetizado, sin archivos). Volumen bajo a propósito.
try { sonido = localStorage.getItem('rancho-sonido') !== '0' } catch {}
;['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (ac && ac.state === 'suspended') ac.resume() }))
function ping() {
  if (!sonido || !ac) return
  try {
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain()
    o.type = 'sine'; o.frequency.setValueAtTime(740, t); o.frequency.setValueAtTime(988, t + 0.08)
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25)
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.26)
  } catch {}
}

/* ---------- Historial local (IndexedDB, uno por sala, indexado por canal) ---------- */
function abrirDB() {
  return new Promise(r => { try {
    const q = indexedDB.open('rancho-' + cfg.appId, 1)
    q.onupgradeneeded = () => q.result.createObjectStore('m', { autoIncrement: true }).createIndex('c', 'c')
    q.onsuccess = () => r(q.result); q.onerror = () => r(null)
  } catch { r(null) } })
}
function guardar(rec) {
  if (!db) return
  try { db.transaction('m', 'readwrite').objectStore('m').add(rec.blob && rec.size > MAXSAVE ? { ...rec, blob: null } : rec) } catch {}
}
function cargar(c) {
  return new Promise(r => { if (!db) return r([])
    try { const q = db.transaction('m').objectStore('m').index('c').getAll(c); q.onsuccess = () => r(q.result); q.onerror = () => r([]) } catch { r([]) } })
}
function borrarHist(c) {
  if (!db) return
  try { const q = db.transaction('m', 'readwrite').objectStore('m').index('c').openCursor(IDBKeyRange.only(c))
    q.onsuccess = () => { const k = q.result; if (k) { k.delete(); k.continue() } } } catch {}
}

/* ---------- Login ---------- */
try { $('nick').value = localStorage.getItem('rancho-nick') || ''; $('srv').value = localStorage.getItem('rancho-sala') || '' } catch {}
;($('nick').value && $('srv').value ? $('pwd') : $('nick').value ? $('srv') : $('nick')).focus()

$('f').onsubmit = async e => {
  e.preventDefault()
  nick = $('nick').value.trim()
  try { localStorage.setItem('rancho-nick', nick); localStorage.setItem('rancho-sala', $('srv').value.trim())
    sessionStorage.setItem('rancho-pwd', $('pwd').value) } catch {}   // la clave solo dura mientras la pestaña esté abierta
  cfg = { appId: 'rancho-p2p-' + $('srv').value.trim().toLowerCase(), password: $('pwd').value, rtcConfig }
  $('login').style.display = 'none'; $('app').style.display = 'grid'
  try { ac = new (window.AudioContext || window.webkitAudioContext)() } catch {}
  db = await abrirDB()
  try { const g = JSON.parse(localStorage.getItem('canales2-' + cfg.appId))
    if (g && typeof g === 'object') Object.entries(g).forEach(([c, v]) => fusionar(c, v, false)) } catch {}
  iniciarSala(); pintarCanales(); entrar('general')
}
$('reco').onclick = () => location.reload()
$('salir').onclick = () => { try { sessionStorage.removeItem('rancho-pwd') } catch {} location.reload() }

/* ---------- Canales: etiquetas dentro de una única sala; gana el cambio más nuevo ---------- */
function recalcular() { canales = Object.keys(estado).filter(c => !estado[c].del) }
function guardarCanales() { try { localStorage.setItem('canales2-' + cfg.appId, JSON.stringify(estado)) } catch {} }
function cambiar(c, del) {
  estado[c] = { ts: Date.now(), del }; recalcular(); guardarCanales()
  acts.sendCan({ t: 'set', c, del, ts: estado[c].ts })
  if (del) { borrarHist(c); noLeidos.delete(c) }
}
function fusionar(c, v, avisar) {
  c = limpio(String(c))
  if (!c || c === 'general' || !v || typeof v.ts !== 'number') return
  if (estado[c] && estado[c].ts >= v.ts) return
  const antes = estado[c] && !estado[c].del
  estado[c] = { ts: v.ts, del: !!v.del }; recalcular()
  if (avisar && antes !== !v.del) sys((v.del ? 'Se quitó' : 'Se creó') + ' el canal #' + c)
  if (v.del) { borrarHist(c); noLeidos.delete(c); if (canal === c) entrar('general') }
}
function pintarCanales() {
  $('chs').innerHTML = ''
  canales.forEach(c => {
    const r = document.createElement('div'); r.className = 'row'
    const b = document.createElement('button'); b.className = 'ch' + (c === canal ? ' on' : '') + (noLeidos.has(c) ? ' new' : '')
    b.textContent = '# ' + c; b.onclick = () => entrar(c); r.append(b)
    if (c !== 'general') {
      const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.title = 'Quitar canal'
      x.setAttribute('aria-label', 'Quitar canal ' + c)
      x.onclick = () => { if (confirm('¿Quitar #' + c + ' para todos? Se borra también su historial.')) {
        cambiar(c, true); if (canal === c) entrar('general'); else pintarCanales() } }
      r.append(x)
    }
    $('chs').append(r)
  })
}
$('add').onclick = () => {
  const c = limpio(prompt('Nombre del canal nuevo') || '')
  if (!c) return
  if (c !== 'general' && !canales.includes(c)) cambiar(c, false)
  entrar(c)
}

/* ---------- Render ---------- */
const URL_RE = /https?:\/\/[^\s<]+/g
function ytId(u) {
  try {
    const x = new URL(u); let id = ''
    if (x.hostname === 'youtu.be') id = x.pathname.slice(1)
    else if (/(^|\.)youtube\.com$/.test(x.hostname)) {
      if (x.pathname === '/watch') id = x.searchParams.get('v') || ''
      else { const m = x.pathname.match(/^\/(shorts|embed|live)\/([\w-]+)/); if (m) id = m[2] }
    }
    return /^[\w-]{11}$/.test(id) ? id : null
  } catch { return null }
}
function renderTexto(texto) {
  const frag = document.createDocumentFragment(), embeds = []
  let ult = 0
  for (const m of texto.matchAll(URL_RE)) {
    frag.append(document.createTextNode(texto.slice(ult, m.index)))
    const a = document.createElement('a'); a.href = m[0]; a.textContent = m[0]; a.target = '_blank'; a.rel = 'noopener noreferrer'
    frag.append(a); ult = m.index + m[0].length
    const id = ytId(m[0])
    if (id) { const f = document.createElement('iframe')
      f.src = 'https://www.youtube-nocookie.com/embed/' + id; f.allowFullscreen = true; f.loading = 'lazy'
      f.allow = 'accelerometer; autoplay; encrypted-media; picture-in-picture'; f.title = 'Video de YouTube'; embeds.push(f) }
  }
  frag.append(document.createTextNode(texto.slice(ult)))
  embeds.forEach(e => frag.append(e))
  return frag
}
const cercaFinal = () => { const m = $('msgs'); return m.scrollHeight - m.scrollTop - m.clientHeight < 150 }
function botonBajar() {
  const m = $('msgs'), lejos = m.scrollHeight - m.scrollTop - m.clientHeight > 300
  if (!lejos) nuevos = 0
  $('down').style.display = lejos ? 'block' : 'none'
  $('down').textContent = nuevos ? '↓ ' + nuevos + ' nuevo(s)' : '↓ Ir al final'
}
function bajar(suave) { const m = $('msgs'); m.scrollTo({ top: m.scrollHeight, behavior: suave ? 'smooth' : 'auto' }); nuevos = 0; botonBajar() }
$('msgs').onscroll = botonBajar
$('down').onclick = () => bajar(true)
function add(cls, who, contenido) {
  const pegado = cercaFinal()
  const d = document.createElement('div'); d.className = 'm ' + cls
  if (who) { const b = document.createElement('b'); b.textContent = who + ': '; d.append(b) }
  d.append(contenido); $('msgs').append(d)
  if (pegado || cls === 'me') bajar(); else { if (cls !== 'sys') nuevos++; botonBajar() }
}
const sys = t => add('sys', '', document.createTextNode(t))
function pintarMsg(rec) {
  const cls = rec.me ? 'me' : '', pegado = cercaFinal() || rec.me
  if (rec.k === 't') return add(cls, rec.who, renderTexto(rec.t))
  const w = document.createElement('div'); w.className = 'adj'
  if (!rec.blob) { w.textContent = rec.nombre + ' (' + fmt(rec.size) + ', demasiado grande para guardarse)'; return add(cls, rec.who, w) }
  const url = URL.createObjectURL(rec.blob), m = String(rec.mime || rec.blob.type || '')
  if (m.startsWith('image/')) {
    const a = document.createElement('a'); a.href = url; a.target = '_blank'
    const img = document.createElement('img'); img.src = url; img.alt = rec.nombre; img.onload = () => { if (pegado) bajar() }
    a.append(img); w.append(a)
  } else if (m.startsWith('video/') || m.startsWith('audio/')) {
    const v = document.createElement(m.startsWith('video/') ? 'video' : 'audio'); v.src = url; v.controls = true; v.preload = 'metadata'; v.onloadedmetadata = () => { if (pegado) bajar() }; w.append(v)
  } else {
    const a = document.createElement('a'); a.href = url; a.download = rec.nombre; a.textContent = rec.nombre + ' (' + fmt(rec.size) + ')'; w.append(a)
  }
  add(cls, rec.who, w)
}
function pintarPeers() {
  const l = $('plist'); l.innerHTML = ''
  const fila = (txt, id) => {
    const d = document.createElement('div'); d.className = 'peer'
    d.innerHTML = '<span class="dot"></span>'
    const s = document.createElement('span'); s.textContent = txt; d.append(s)
    if (id && remotos[id] && remotos[id].voz) {   // control de volumen de quien está hablando
      const r = document.createElement('input'); r.type = 'range'; r.min = 0; r.max = 1; r.step = 0.05
      r.value = volumenes[id] ?? 1; r.title = 'Volumen de ' + txt; r.setAttribute('aria-label', 'Volumen de ' + txt)
      r.oninput = () => { volumenes[id] = +r.value; if (remotos[id] && remotos[id].voz) remotos[id].voz.volume = volumenes[id] }
      d.append(r)
    }
    l.append(d)
  }
  fila(nick + ' (vos)')
  Object.entries(peers).forEach(([id, p]) => fila((p.nick || 'alguien') + (p.canal && p.canal !== canal ? '  #' + p.canal : ''), id))
  const n = Object.keys(peers).length
  $('status').textContent = n ? n + ' amigo(s) conectado(s)' : 'Buscando amigos…'
}

/* ---------- Sala única ---------- */
function iniciarSala() {
  room = joinRoom(cfg, 'main')
  const [sendMsg, onMsg] = room.makeAction('chat')
  const [sendPerfil, onPerfil] = room.makeAction('perfil')
  const [sendFile, onFile] = room.makeAction('archivo')
  const [sendCan, onCan] = room.makeAction('canales')
  const [sendFin, onFin] = room.makeAction('fin')
  acts = { sendMsg, sendPerfil, sendFile, sendCan, sendFin }

  room.onPeerJoin(id => {
    peers[id] = { nick: 'alguien', canal: null }
    sendPerfil({ nick, canal }, id); sendCan({ t: 'estado', e: estado }, id); pintarPeers()
  })
  room.onPeerLeave(id => {
    delete peers[id]; quitarRemoto(id)
    ;[...enviados].filter(k => k.endsWith(id)).forEach(k => enviados.delete(k))
    pintarPeers()
  })
  onPerfil((p, id) => {
    const c = limpio(String(p.canal || 'general')) || 'general'
    peers[id] = { nick: String(p.nick).slice(0, 20), canal: c }
    if (c !== canal) quitarRemoto(id)
    pintarPeers(); sincronizar()
  })
  onCan(m => {
    if (m.t === 'estado' && m.e) Object.entries(m.e).forEach(([c, v]) => fusionar(c, v, false))
    if (m.t === 'set') fusionar(m.c, { ts: m.ts, del: m.del }, true)
    guardarCanales(); pintarCanales()
  })
  onMsg((m, id) => recibir({ k: 't', c: m.c, t: String(m.t).slice(0, 4000) }, id))
  const rx = {}
  onFile((buf, id, meta) => {
    const k = id + meta.fid, r = rx[k] = rx[k] || { parts: [], n: 0 }
    r.parts.push(buf); r.n++
    $('prog').style.width = (r.n / meta.total * 100) + '%'
    if (r.n === meta.total) {
      delete rx[k]; setTimeout(() => $('prog').style.width = 0, 500)
      const mime = String(meta.mime || '')
      recibir({ k: 'f', c: meta.c, nombre: String(meta.nombre).slice(0, 120), size: meta.size, mime, blob: new Blob(r.parts, { type: mime }) }, id)
    }
  })
  onFin(({ tipo }, id) => quitarRemoto(id, tipo))
  room.onPeerStream((stream, id, meta) => mostrarStream(stream, id, meta || {}))
}
function recibir(rec, id) {
  const c = limpio(String(rec.c || '')) || 'general'
  if (estado[c]?.del) return
  if (!estado[c]) { estado[c] = { ts: 0, del: false }; recalcular(); guardarCanales() }
  rec.c = c; rec.who = peers[id]?.nick || 'alguien'
  guardar(rec); ping()
  if (c === canal) pintarMsg(rec); else { noLeidos.add(c); pintarCanales() }
}
async function entrar(c) {
  detener('voz'); detener('pantalla'); quitarTodosRemotos()
  canal = c; noLeidos.delete(c)
  $('title').textContent = '# ' + c; $('msgs').innerHTML = ''; nuevos = 0; botonBajar()
  pintarCanales(); pintarPeers()
  acts.sendPerfil({ nick, canal })
  const h = await cargar(c)
  if (canal === c) { h.forEach(pintarMsg); bajar() }
}

/* ---------- Chat y archivos ---------- */
function mandar() {
  const t = $('txt').value.trim(); if (!t) return
  const rec = { k: 't', c: canal, t, who: nick, me: true }
  acts.sendMsg({ c: canal, t }); guardar(rec); pintarMsg(rec); $('txt').value = ''
}
$('bSend').onclick = mandar
$('txt').onkeydown = e => { if (e.key === 'Enter') mandar() }

async function enviarArchivo(f) {
  if (!f) return
  const c = canal, nombre = f.name || 'imagen.png'
  const rec = { k: 'f', c, who: nick, me: true, nombre, size: f.size, mime: f.type, blob: f }
  guardar(rec); pintarMsg(rec)
  const total = Math.max(1, Math.ceil(f.size / CHUNK)), meta = { fid: Math.random().toString(36).slice(2), total, nombre, size: f.size, mime: f.type, c }
  for (let i = 0; i < total; i++) {
    await acts.sendFile(await f.slice(i * CHUNK, (i + 1) * CHUNK).arrayBuffer(), null, meta)
    $('prog').style.width = ((i + 1) / total * 100) + '%'
  }
  setTimeout(() => $('prog').style.width = 0, 500)
}
$('bFile').onclick = () => $('file').click()
$('file').onchange = e => { enviarArchivo(e.target.files[0]); e.target.value = '' }
document.addEventListener('paste', e => {
  const it = [...(e.clipboardData?.items || [])].find(i => i.kind === 'file')
  if (it) { e.preventDefault(); enviarArchivo(it.getAsFile()) }
})
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag') })
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drag') })
document.addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('drag'); [...e.dataTransfer.files].forEach(enviarArchivo) })

/* ---------- Voz y pantalla: solo se envían a quienes están en tu mismo canal ---------- */
function sincronizar() {
  Object.entries(peers).forEach(([id, p]) => ['voz', 'pantalla'].forEach(t => {
    const s = salida[t]; if (!s) return
    const k = t + id, debe = p.canal === canal
    if (debe && !enviados.has(k)) { room.addStream(s, id, { tipo: t, c: canal }); enviados.add(k) }
    else if (!debe && enviados.has(k)) { try { room.removeStream(s, id) } catch {} enviados.delete(k) }
  }))
}
function detener(t) {
  const s = salida[t]; if (!s) return
  ;[...enviados].filter(k => k.startsWith(t)).forEach(k => { try { room.removeStream(s, k.slice(t.length)) } catch {} enviados.delete(k) })
  s.getTracks().forEach(x => x.stop()); salida[t] = null
  acts.sendFin({ tipo: t }); uiMedia()
}
function uiMedia() {
  $('bMic').textContent = salida.voz ? 'Salir de voz' : 'Activar voz'; $('bMic').classList.toggle('on', !!salida.voz)
  $('bMute').disabled = !salida.voz; $('bMute').textContent = 'Silenciar'
  $('bScr').textContent = salida.pantalla ? 'Dejar de compartir' : 'Compartir pantalla'; $('bScr').classList.toggle('on', !!salida.pantalla)
}
function mostrarStream(stream, id, meta) {
  const t = meta.tipo === 'pantalla' ? 'pantalla' : 'voz'
  if (meta.c !== canal) return
  quitarRemoto(id, t)
  const el = document.createElement(t === 'pantalla' ? 'video' : 'audio')
  el.srcObject = stream; el.autoplay = true; el.playsInline = true
  if (t === 'pantalla') { el.controls = true; $('stage').append(el); $('stage').style.display = 'flex' }
  else { el.hidden = true; document.body.append(el) }
  if (el.play) el.play().catch(() => sys('Tocá la pantalla para activar el audio.'))
  if (t === 'voz') el.volume = volumenes[id] ?? 1
  remotos[id] = remotos[id] || {}; remotos[id][t] = el
  pintarPeers()
}
function quitarRemoto(id, t) {
  const r = remotos[id]; if (!r) return
  const ks = t ? [t] : Object.keys(r)
  ks.forEach(k => { if (r[k]) { r[k].remove(); delete r[k] } })
  if (!$('stage').children.length) $('stage').style.display = 'none'
  pintarPeers()
}
function quitarTodosRemotos() { Object.keys(remotos).forEach(id => quitarRemoto(id)) }

$('bMic').onclick = async () => {
  if (salida.voz) return detener('voz')
  try {
    salida.voz = await navigator.mediaDevices.getUserMedia({ audio: restricciones() })
    sincronizar(); uiMedia()
  } catch { sys('No se pudo usar el micrófono. Revisá el permiso del navegador.') }
}
const restricciones = () => ({ echoCancellation: true, noiseSuppression: ruido, autoGainControl: true })
$('bRuido').onclick = async () => {
  ruido = !ruido
  $('bRuido').textContent = 'Supresión de ruido: ' + (ruido ? 'sí' : 'no'); $('bRuido').classList.toggle('on', ruido)
  const t = salida.voz && salida.voz.getAudioTracks()[0]
  if (t) { try { await t.applyConstraints(restricciones()) } catch { sys('Tu navegador no deja cambiarlo en vivo: salí de voz y volvé a entrar.') } }
}
$('bMute').onclick = () => {
  const t = salida.voz.getAudioTracks()[0]; t.enabled = !t.enabled
  $('bMute').textContent = t.enabled ? 'Silenciar' : 'Activar mic'
}
$('bScr').onclick = async () => {
  if (salida.pantalla) return detener('pantalla')
  try {
    salida.pantalla = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true })
    salida.pantalla.getVideoTracks()[0].onended = () => detener('pantalla')
    sincronizar(); uiMedia()
  } catch { salida.pantalla = null }
}

/* ---------- Sonido on/off ---------- */
$('snd').textContent = 'Sonido: ' + (sonido ? 'sí' : 'no')
$('snd').onclick = () => {
  sonido = !sonido
  try { localStorage.setItem('rancho-sonido', sonido ? '1' : '0') } catch {}
  $('snd').textContent = 'Sonido: ' + (sonido ? 'sí' : 'no'); if (sonido) ping()
}

/* ---------- Selector de emojis completo (se carga recién al abrirlo) ---------- */
let picker = null
const EMO = 'https://cdn.jsdelivr.net/npm/emoji-picker-element@1.21.3'
const EMO_ES = 'https://cdn.jsdelivr.net/npm/emoji-picker-element-data@^1/es/emojibase/data.json'
$('bEmo').onclick = async () => {
  const box = $('emo')
  if (box.style.display === 'block') { box.style.display = 'none'; return }
  box.style.display = 'block'
  if (picker) return
  box.textContent = 'Cargando emojis…'
  try {
    await import(EMO + '/+esm')
    picker = document.createElement('emoji-picker'); picker.className = 'dark'
    let es = false
    try { es = (await fetch(EMO_ES, { method: 'HEAD' })).ok } catch {}
    if (es) { picker.setAttribute('locale', 'es'); picker.setAttribute('data-source', EMO_ES)
      try { picker.i18n = (await import(EMO + '/i18n/es.js')).default } catch {} }
    picker.addEventListener('emoji-click', ev => {
      const i = $('txt'), a = i.selectionStart ?? i.value.length, b = i.selectionEnd ?? a
      i.setRangeText(ev.detail.unicode, a, b, 'end'); i.focus()
    })
    box.textContent = ''; box.append(picker)
  } catch { box.textContent = 'No se pudo cargar el selector de emojis. Revisá tu conexión.' }
}
document.addEventListener('click', e => { if (!$('emo').contains(e.target) && e.target !== $('bEmo')) $('emo').style.display = 'none' })
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('emo').style.display = 'none' })

/* ---------- Si recargaste con "Reconectar", entra solo ---------- */
try { const p = sessionStorage.getItem('rancho-pwd')
  if (p && $('nick').value && $('srv').value) { $('pwd').value = p; $('f').requestSubmit() } } catch {}
</script>
